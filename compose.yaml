services:
# ============================================
# Database service
# ============================================
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
# ============================================
# Migration
# ============================================
  migration:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: migration
    env_file:
      - .docker.env
    depends_on:
      - db
    restart: "no"
# ============================================
# Prodaction service
# ============================================
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: production
    env_file:
      - .docker.env
    ports:
      - "8080:8080"
    depends_on:
      - migration
# ============================================
# Prod distroless
# ============================================
  app-distroless:
    build:
      context: .
      dockerfile: ./Dockerfile
      target: prod-distroless
    env_file:
      - .docker.env
    ports:
      - "8081:8080"
    depends_on:
      - migration
volumes:
  db-data: {}
  node_modules: {}